name: geo-national-hub

services:
  typesense:
    image: typesense/typesense:30.1
    restart: unless-stopped

    container_name: geo-national-hub-typesense

    ports:
      - '8108:8108'

    volumes:
      - typesense-data:/data

    command: --data-dir /data --api-key=xyz

volumes:
  typesense-data:
